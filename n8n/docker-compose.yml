services:
  n8n:
    image: n8nio/n8n:latest
    container_name: jobagent-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - TZ=Asia/Manila
      - GENERIC_TIMEZONE=Asia/Manila
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
